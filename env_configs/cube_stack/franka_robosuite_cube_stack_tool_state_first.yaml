# Usage: uv run capx/envs/launch.py --config-path env_configs/cube_stack/franka_robosuite_cube_stack_tool_state_first.yaml

env:
  _target_: capx.envs.tasks.franka.franka_pick_place.FrankaPickPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_low_level
    privileged: false
    apis:
      - FrankaStateControlApi
    prompt: |
      You are controlling a Franka Emika robot by selecting one JSON tool call at a time.
      Goal: place the red cube on top of the green cube and then open the gripper.
      The simulator observation returned by get_observation includes true task state keys such as cubeA_pos, cubeA_quat, cubeB_pos, cubeB_quat, robot0_eef_pos, and robot0_eef_quat. Use these state values directly for planning.
      Do not write Python code.

agent_mode: tool
max_tool_steps: 20
tool_feedback_level: repair_hint

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: false
use_img_differencing: false
output_dir: ./outputs/franka_robosuite_cube_stack_tool_state_first

trials: 100
num_workers: 12
