# A3 ablation: llm_step without append_recovery; patch remains available.
# Usage: uv run capx/envs/launch.py --config-path env_configs/cube_stack/franka_robosuite_cube_stack_capsule_llm_step_a3_no_append_recovery.yaml

env:
  _target_: capx.envs.tasks.franka.franka_pick_place.FrankaPickPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_low_level
    privileged: false
    apis:
      - FrankaControlApi

agent_mode: capsule
capsule_control_mode: llm_step
max_capsule_steps: 12
capsule_llm_step_compact_context: true
capsule_llm_step_allow_patch: true
capsule_llm_step_allow_append_recovery: false
capsule_execution_granularity: semantic_group
capsule_max_regions_per_group: 20
checkpoint_policy: region
rollback_policy: none
capsule_feedback_level: source_region_repair_hint

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: false
use_img_differencing: false
use_video_differencing: false
output_dir: ./outputs/franka_robosuite_cube_stack_capsule_llm_step_a3_no_append_recovery

trials: 100
num_workers: 12
