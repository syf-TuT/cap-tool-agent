    strategy: fsdp
    ppo_mini_batch_size: 8
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 10240
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    freeze_vision_tower: false
    policy_loss:
      _target_: capx.rl.capsule.verl_config.CapsulePolicyLossConfig
      loss_mode: capsule_critique
      clip_cov_ratio: 0.0002
      clip_cov_lb: 1.0
      clip_cov_ub: 5.0
      kl_cov_ratio: 0.0002
      ppo_kl_coef: 0.1
      capsule_gamma: 0.1
    clip_ratio_c: 3.0
    loss_agg_mode: token-mean
    entropy_coeff: 0.0
    use_kl_loss: true
    use_torch_compile: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: false
    checkpoint:
      _target_: verl.trainer.config.CheckpointConfig
      save_contents: [model, optimizer, extra]
      load_contents: [model, optimizer, extra]
      async_save: false
    use_fused_kernels: false
    profiler: &disabled_profiler
      _target_: verl.utils.profiler.ProfilerConfig
      tool: null
      enable: false
      all_ranks: false
      ranks: []
      save_path: null
