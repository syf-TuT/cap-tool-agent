# Usage: uv run capx/envs/launch.py --config-path env_configs/cube_restack/franka_robosuite_cube_restack_tool_vdm.yaml

env:
  _target_: capx.envs.tasks.franka.franka_cube_restack.FrankaRestackCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_restack_low_level
    privileged: false
    apis:
      - FrankaControlApiReducedSkillLibrary
    prompt: |
      You are controlling a Franka Emika robot by selecting one JSON tool call at a time.
      Goal: place the red cube on top of the green cube and then open the gripper.
      Do not write Python code.

agent_mode: tool
max_tool_steps: 20
tool_feedback_level: repair_hint

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_img_differencing: true
output_dir: ./outputs/franka_robosuite_cube_restack_tool_vdm

trials: 1
num_workers: 1
