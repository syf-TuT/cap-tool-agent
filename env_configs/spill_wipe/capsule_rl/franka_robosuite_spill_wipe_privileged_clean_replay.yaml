# Privileged high-level Spill Wipe, using the task's original prompt and APIs.
env:
  _target_: capx.envs.tasks.franka.franka_spill_wipe.FrankaSpillWipeCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_spill_wipe_low_level
    privileged: true
    enable_render: false
    viser_debug: false
    apis:
      - FrankaControlSpillWipePrivilegedApi

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: false
output_dir: ./outputs/spill_wipe_capsule_rl_clean_replay
trials: 1
num_workers: 1
