# LIBERO ablation template. The standalone default is Spatial task 0.

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_spatial
      task_id: 0
      privileged: false
      max_steps: 8000
      control_freq: 20
    privileged: false
    apis:
      - FrankaLiberoApi
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: {libero_environment_goal}
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

agent_mode: code
capsule_control_mode: llm_step
max_capsule_steps: 12
capsule_llm_step_compact_context: true
capsule_llm_step_allow_patch: false
capsule_llm_step_allow_append_recovery: false
capsule_execution_granularity: semantic_group
capsule_max_regions_per_group: 20
checkpoint_policy: region
rollback_policy: none
capsule_feedback_level: source_region_repair_hint

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
use_visual_feedback: false
use_img_differencing: false
use_video_differencing: false
use_parallel_ensemble: false
use_multimodel: false
output_dir: ./outputs/franka_libero_a1_one_shot

trials: 50
num_workers: 10
