# LIBERO Object Task 0 with non-privileged Capsule llm-step control.
# Usage: uv run --no-sync capx/envs/launch.py \
#   --config-path env_configs/libero/franka_libero_object_0_capsule_llm_step.yaml

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_object
      task_id: 0
      privileged: false
      max_steps: 8000
      control_freq: 20
    privileged: false
    apis:
      - FrankaLiberoApi
    prompt: |
      You are controlling a Franka Emika robot with the API described below.
      Goal: {libero_environment_goal}
      Generate one complete executable Python program for the goal.
      The strict Python subset is mandatory for this non-privileged Capsule program.
      Use no imports, classes, lambdas, try, while, or async constructs.
      Dynamic or reflective calls, callable aliases, and attribute calls are also forbidden.
      Use only direct calls to the public API functions and safe builtins.
      You may also directly call proven-pure top-level helper functions.
      Use only statically bounded for loops.
      Keep the whole program within the total static computation budget.
      Robot side effects must be top-level.
      Use at most one robot side-effect API call per semantic group.
      You may write Python code comments for reasoning.
      Write only executable Python code and do not use code fences.
      The public API functions below are already available in the restricted execution environment.

agent_mode: capsule
capsule_control_mode: llm_step
max_capsule_steps: 24
capsule_execution_granularity: semantic_group
capsule_progress_mode: sparse_terminal
capsule_require_task_success_for_finish: true
capsule_validate_program_contract: true
capsule_action_visual_feedback: true
capsule_prompt_state_level: proprioceptive
capsule_diagnostic_state_level: full

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
use_visual_feedback: true
use_wrist_camera: true
use_parallel_ensemble: false
output_dir: ./outputs/franka_libero_object_0_capsule_llm_step

trials: 1
num_workers: 1
