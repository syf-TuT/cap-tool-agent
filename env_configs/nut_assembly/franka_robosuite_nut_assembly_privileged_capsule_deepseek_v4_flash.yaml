# Usage: uv run capx/envs/launch.py --config-path env_configs/nut_assembly/franka_robosuite_nut_assembly_privileged_capsule_deepseek_v4_flash.yaml

env:
  _target_: capx.envs.tasks.franka.franka_nut_assembly.FrankaNutAssemblyCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_nut_assembly_low_level
    privileged: true
    apis:
      - FrankaControlNutAssemblyPrivilegedApi
    # prompt is inherited from FrankaNutAssemblyCodeEnv class default

agent_mode: capsule
max_capsule_steps: 60
checkpoint_policy: region
rollback_policy: none
capsule_feedback_level: source_region_repair_hint

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_img_differencing: false
use_video_differencing: false
output_dir: ./outputs/franka_robosuite_nut_assembly_privileged_capsule_deepseek_v4_flash_steps60

use_oracle_code: false
trials: 1
num_workers: 1
