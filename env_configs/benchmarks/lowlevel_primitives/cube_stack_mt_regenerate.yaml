# Low-level primitive benchmark: cube_stack, multiturn full-code regeneration baseline.

env:
  _target_: capx.envs.tasks.franka.franka_pick_place.FrankaPickPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_low_level
    privileged: true
    apis:
      - FrankaControlPrivilegedApi
    prompt: |
      You are controlling a Franka Emika robot with the API described below.
      Goal: Pick up the red cube and gently stack it on top of the green cube, then release it.

      Key rules:
      - The extent from get_object_pose(..., return_bbox_extent=True) is the FULL side length. Use extent[2]/2 for half-height.
      - For placement orientation, reuse the grasp quaternion from sample_grasp_pose. Do NOT use the quaternion from get_object_pose (it is unreliable for orientation).
      - Always use z_approach=0.1 when approaching an object for grasping or placing.
      - After grasping, lift the cube to a safe height (at least +0.2m in Z) before moving laterally to the placement location.
      - The stacking height formula is: place_z = green_center_z + green_extent[2]/2 + red_extent[2]/2.
      - Nothing should be dropped from a height. Always approach with z_approach for controlled descent.

      Write ONLY executable Python code (no code fences). Import numpy if needed.
      After this code executes, you will receive stdout/stderr and may regenerate the remaining code.
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were errors, regenerate the remaining executable Python code.
      If the task is complete, respond with FINISH.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the remaining code.
      - The word 'FINISH' if the task appears to be complete.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: false
use_img_differencing: false
use_video_differencing: false
output_dir: ./outputs/bench_lowlevel/cube_stack/mt_regenerate

use_oracle_code: false
trials: 1
num_workers: 1
