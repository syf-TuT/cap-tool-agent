# Server-only privileged Cube Lift environment for deterministic clean replay.
# Parsing this file has no side effects. Runtime smoke code starts PyRoKi separately.
env:
  _target_: capx.envs.tasks.franka.franka_lift.FrankaLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cube_lift_low_level
    privileged: true
    enable_render: false
    viser_debug: false
    apis:
      - FrankaControlPrivilegedApi

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: false
output_dir: ./outputs/cube_lift_privileged_clean_replay
trials: 1
num_workers: 1
